{% extends "base.html" %}
{% block title %}Log In | The Money Game{% endblock title %}
{% block content %}
<div class="wrapper public-page">
    <h1 class="page__heading">Log In</h1>
    <form action="/session" method="POST">
        <div class="form__input-group">
            <label for="email" class="form__label">Email</label>
            <input id="email" name="email" type="email" class="form__input" />
        </div>
        <div class="form__input-group">
            <label for="pwd" class="form__label">Password</label>
            <input id="pwd" name="password" type="password" class="form__input" />
        </div>
        <button type="submit" class="form__button">Log In</button>
    </form>
</div>
{% endblock %}
